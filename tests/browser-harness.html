<!doctype html><html lang="es"><meta charset="utf-8"><title>Claret Logic · QA interno</title><style>body{font:16px system-ui;background:#dbe4ee}header{display:flex;gap:10px;flex-wrap:wrap;margin:12px}button,select{font:inherit;padding:8px}iframe{display:block;border:1px solid #506077;background:white}label{padding:8px}</style><header><label>Anchura <select id="width"><option>320</option><option>390</option><option>768</option><option selected>1280</option></select></label><label>Reto <select id="level"><option>1</option><option>2</option><option>3</option><option>5</option><option>19</option><option>49</option><option>100</option></select></label><button id="seed">Preparar partida de prueba</button><button id="onboard">Nueva partida con prácticas</button><button id="dailytest">Probar racha diaria</button><button id="textzoom">Texto al 200 %</button><button id="reload">Recargar juego</button><p id="status" role="status">Entorno de pruebas independiente de producción.</p></header><iframe id="gameframe" title="Juego en prueba" width="1280" height="900" src="/"></iframe><script type="module">
import {fresh,KEY,dateKey} from '/js/state.js';
const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>{frame.width=e.target.value;frame.height=Number(e.target.value)<500?844:900;};
document.querySelector('#seed').onclick=()=>{const s=fresh();s.tutorialDone=true;s.index=Number(document.querySelector('#level').value)-1;s.completed=s.index;s.daily.last=dateKey();s.sound=false;localStorage.setItem(KEY,JSON.stringify(s));frame.src='/';document.querySelector('#status').textContent='Partida de prueba preparada en el reto '+(s.index+1);};
document.querySelector('#onboard').onclick=()=>{const s=fresh();s.daily.last=dateKey();s.sound=false;localStorage.setItem(KEY,JSON.stringify(s));frame.src='/';};
document.querySelector('#dailytest').onclick=()=>{const s=fresh();s.sound=false;localStorage.setItem(KEY,JSON.stringify(s));frame.src='/';};
document.querySelector('#textzoom').onclick=()=>{frame.contentDocument.documentElement.style.fontSize='200%';};
document.querySelector('#reload').onclick=()=>frame.contentWindow.location.reload();
</script></html>
